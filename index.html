
<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenStream - Cinematic Discovery</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/000000/movie-projector.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212" />

  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      scroll-behavior: smooth;
      /* Safe area inset for mobile notches */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Performance optimization for smooth scrolling */
    section {
      content-visibility: auto;
      contain-intrinsic-size: 1px 500px;
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .zen-gradient-text {
      background: linear-gradient(to right, #1ce783, #00ed82);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    @keyframes crossFade {
      0% { opacity: 0; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-crossfade {
      animation: crossFade 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Safe Area Utilities */
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mt-safe {
      margin-top: env(safe-area-inset-top);
    }
    .mb-safe {
      margin-bottom: env(safe-area-inset-bottom);
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
