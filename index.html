<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZenStream - Cinematic Discovery</title>
  
  <!-- PWA & Mobile Optimization -->
  <meta name="theme-color" content="#040404" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZenStream" />
  
  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='256' fill='%231ce783'/%3E%3Cpath d='M192 128l192 128-192 128z' fill='white'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Ccircle cx='256' cy='256' r='256' fill='%231ce783'/%3E%3Cpath d='M192 128l192 128-192 128z' fill='white'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --zen-green: #1ce783;
      --zen-dark: #040404;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--zen-dark);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--zen-green);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Skeleton Animation */
    @keyframes pulse {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.2; }
    }
    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      background-color: white;
    }

    /* Zen Intro Animation */
    @keyframes zen-intro {
      0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    .animate-zen-intro {
      animation: zen-intro 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-pulse {
      animation: logo-glow 3s ease-in-out infinite;
    }
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(28, 231, 131, 0.2)); }
      50% { filter: drop-shadow(0 0 40px rgba(28, 231, 131, 0.5)); }
    }

    /* Fix for iOS bottom bar issues in PWA */
    @supports (padding: env(safe-area-inset-bottom)) {
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1"
  }
}
</script>
</head>
<body class="bg-[#040404] text-white overflow-x-hidden selection:bg-[#1ce783] selection:text-black">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
